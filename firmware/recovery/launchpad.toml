# Self-host this file together with the matching factory release artifact.
# SHA-256: <sha256>
#   Fill this in when the release is actually published, together with <tag>
#   below. Take the value from candis_s31_factory_merged.bin.sha256, which
#   tools/release/pack_factory_release.sh writes next to the image. The
#   checksum changes with every rebuild of the factory firmware, so never
#   leave a value here that belongs to an older build.
esp_toml_version = 1.0
supported_apps = ["Candis-S31-Factory"]
multipart = true
chip = "esp32s31"

[Candis-S31-Factory]
image.esp32s31.parts = [
  # <tag> must match the GitHub Release tag that carries
  # candis_s31_factory_merged.bin as an asset (see firmware/factory/README.md
  # "Release requirements"); update it when a release is actually published.
  "https://github.com/jlckfb/Candis-S31/releases/download/<tag>/candis_s31_factory_merged.bin",
]
image.esp32s31.addresses = ["0x0"]
console_baudrate = 115200
