<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candis-S31 LVGL Preview</title>
  <style>
    :root { color-scheme: dark; background: #08090c; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: radial-gradient(circle, #18232b, #08090c 70%); }
    #canvas { width: min(92vw, 70vh); height: min(92vw, 70vh); image-rendering: auto; }
  </style>
</head>
<body>
  <canvas id="canvas" width="460" height="460"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById("canvas"),
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); }
    };

    // Screen-share: stream canvas frames + pointer events back to the
    // preview server so the assistant can watch the user's live session.
    (function() {
      const canvas = document.getElementById("canvas");
      let lastFrame = "";
      setInterval(function() {
        try {
          const data = canvas.toDataURL("image/png");
          if (data !== lastFrame) {
            lastFrame = data;
            fetch("/share/frame", { method: "POST", body: data }).catch(()=>{});
          }
        } catch (e) { /* canvas not ready yet */ }
      }, 500);

      function canvasPos(ev) {
        const r = canvas.getBoundingClientRect();
        return {
          x: Math.round((ev.clientX - r.left) * canvas.width / r.width),
          y: Math.round((ev.clientY - r.top) * canvas.height / r.height)
        };
      }
      function report(kind, ev) {
        const p = canvasPos(ev);
        fetch("/share/event", { method: "POST",
          body: JSON.stringify({ t: Date.now(), kind: kind,
                                 x: p.x, y: p.y, url: location.search })
        }).catch(()=>{});
      }
      canvas.addEventListener("pointerdown", function(ev){ report("down", ev); });
      canvas.addEventListener("pointerup", function(ev){ report("up", ev); });
      setInterval(function() {
        fetch("/share/event", { method: "POST",
          body: JSON.stringify({ t: Date.now(), kind: "url",
                                 url: location.search })
        }).catch(()=>{});
      }, 5000);
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
