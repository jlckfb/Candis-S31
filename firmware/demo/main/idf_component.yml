dependencies:
  idf: '>=5.3'
  espressif/usb_host_msc: ^1.1.4
  # Keep the host preview and firmware on the same exact LVGL release.
  # The committed lock file pins the resolved public packages.
  lvgl/lvgl: '9.5.0'
  # USB Device (CDC) mode for the OTG app. Version constraint mirrors
  # firmware/usb_cdc_device, the board-validated TinyUSB CDC image
  # (lock resolves esp_tinyusb 2.2.1 + tinyusb 0.21.0~1, esp32s31 in
  # both target lists).
  espressif/esp_tinyusb: "^2.0.1~1"
  # HW ASRC for the accel.asrc test (version pinned like firmware/factory).
  espressif/esp_asrc: "~1.1"
