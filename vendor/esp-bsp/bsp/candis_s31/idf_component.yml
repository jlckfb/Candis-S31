version: "1.2.0"
description: Board Support Package for Candis-S31
url: https://github.com/espressif/esp-bsp/tree/master/bsp/candis_s31

targets:
  - esp32s31

tags:
  - bsp

dependencies:
  idf: ">=6.1"

  espressif/fusb303b:
    version: "^0.2.0"
    public: false
    override_path: "../../components/fusb303b"

  espressif/rx8130ce:
    version: "^0.4.0"
    public: true
    override_path: "../../components/rx8130ce"

  espressif/tg28_sw:
    version: "^0.4.0"
    public: false
    override_path: "../../components/tg28_sw"

  esp_codec_dev:
    version: "^1.6.2"
    public: true

  espressif/esp_lvgl_port:
    version: "^2.9.0"
    public: true
    override_path: "../../components/esp_lvgl_port"

  lvgl/lvgl:
    version: "^9"
    public: true

  espressif/esp_lcd_co5300:
    version: "^2.0.3"
    public: false

  espressif/esp_lcd_touch_cst820:
    version: "^1.0.0"
    public: false
    override_path: "../../components/lcd_touch/esp_lcd_touch_cst820"

  esp_video:
    version: "~2.2"
    public: true

  led_indicator:
    version: "^2"
    public: true

  usb:
    version: "^1"
    public: true

examples:
  - path: ../../examples/display
  - path: ../../examples/display_audio_photo
  - path: ../../examples/display_camera_video
  - path: ../../examples/display_lvgl_demos
  - path: ../../examples/display_lvgl_benchmark
  - path: ../../examples/display_sdcard
