name: ESP-IDF build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Update the tag and commit together after the new version passes validation.
  IDF_REF: v6.1-rc1
  IDF_COMMIT: 44f0c59f7c81a72a5868a52d5f6dfbbf88829704
  # The board runtime is first-party under components/candis_s31. Reusable
  # drivers and Board Manager sources are mirrored under vendor/ and are
  # consumed through relative override_path entries.

jobs:
  getting-started:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          test "$(git -C "$RUNNER_TEMP/esp-idf" rev-parse HEAD)" = "$IDF_COMMIT"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s31

      - name: Build getting started
        run: |
          . "$RUNNER_TEMP/esp-idf/export.sh"
          idf.py --preview -C examples/esp-idf/getting-started \
            -D IDF_TARGET=esp32s31 build

  # The board component and four reusable drivers are part of this checkout.
  # Their test apps are the acceptance gate for the code that firmware/factory
  # depends on, so CI compiles them with the same flags as build-all.sh.
  drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-${{ env.IDF_COMMIT }}-esp32s31-v1

      - name: Install ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"
          ~/esp-idf/install.sh esp32s31

      - name: Verify cached ESP-IDF
        if: steps.idf-cache.outputs.cache-hit == 'true'
        run: test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"

      - name: Build board tests and reusable driver examples
        run: |
          . ~/esp-idf/export.sh
          for app in \
            components/candis_s31/test_apps \
            vendor/idf-extra-components/tg28_sw/test_apps \
            vendor/idf-extra-components/rx8130ce/test_apps \
            vendor/idf-extra-components/fusb303b/test_apps \
            vendor/idf-extra-components/esp_lcd_touch_cst820/test_apps \
            vendor/idf-extra-components/tg28_sw/examples/get_started \
            vendor/idf-extra-components/rx8130ce/examples/get_started \
            vendor/idf-extra-components/fusb303b/examples/get_started \
            vendor/idf-extra-components/esp_lcd_touch_cst820/examples/get_started; do
            echo "::group::$app"
            ( cd "$app" \
              && idf.py --preview -B build_esp32s31 -D IDF_TARGET=esp32s31 build )
            echo "::endgroup::"
          done

  low-power:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: idf-cache
