name: ESP-IDF build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Update the tag and commit together after the new version passes validation.
  IDF_REF: v6.1-beta1
  IDF_COMMIT: b1d13e9fe441c4f75e240c98a26fd631b7b3232f
  # BSP revision required by the Factory and low-power APIs. Push this BSP
  # commit before the product commit so the public CI checkout remains exact.
  ESP_BSP_COMMIT: cf9f87ab40630c2576a316de3f4e996dded700e3

jobs:
  getting-started:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          test "$(git -C "$RUNNER_TEMP/esp-idf" rev-parse HEAD)" = "$IDF_COMMIT"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s31

      - name: Build getting started
        run: |
          . "$RUNNER_TEMP/esp-idf/export.sh"
          idf.py --preview -C examples/esp-idf/getting-started set-target esp32s31
          idf.py --preview -C examples/esp-idf/getting-started build

  # The four development drivers live in the ESP-BSP worktree, not in this
  # repository. Their test apps are the acceptance gate for the components that
  # bsp/candis_s31 and firmware/factory depend on, so CI compiles them with the
  # same flags tools/build-all.sh uses locally.
  drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-${{ env.IDF_COMMIT }}-esp32s31-v1

      - name: Install ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"
          ~/esp-idf/install.sh esp32s31

      - name: Verify cached ESP-IDF
        if: steps.idf-cache.outputs.cache-hit == 'true'
        run: test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"

      - name: Fetch ESP-BSP (Candis-S31 drivers)
        run: |
          git clone https://github.com/LeenixP/esp-bsp.git "$RUNNER_TEMP/esp-bsp"
          git -C "$RUNNER_TEMP/esp-bsp" checkout "$ESP_BSP_COMMIT"

      - name: Build driver test apps
        run: |
          . ~/esp-idf/export.sh
          for app in \
            components/tg28_sw/test_apps \
            components/rx8130ce/test_apps \
            components/fusb303b/test_apps \
            components/lcd_touch/esp_lcd_touch_cst820/test_apps; do
            echo "::group::$app"
            ( cd "$RUNNER_TEMP/esp-bsp/$app" \
              && idf.py --preview -B build_esp32s31 -D IDF_TARGET=esp32s31 build )
            echo "::endgroup::"
          done

  low-power:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-${{ env.IDF_COMMIT }}-esp32s31-v1

      - name: Install ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"
          ~/esp-idf/install.sh esp32s31

      - name: Verify cached ESP-IDF
        if: steps.idf-cache.outputs.cache-hit == 'true'
        run: test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"

      - name: Fetch ESP-BSP (Candis-S31 BSP)
        run: |
          git clone https://github.com/LeenixP/esp-bsp.git "$RUNNER_TEMP/esp-bsp"
          git -C "$RUNNER_TEMP/esp-bsp" checkout "$ESP_BSP_COMMIT"

      - name: Build low-power example
        run: |
          . ~/esp-idf/export.sh
          CANDIS_S31_BSP_PATH="$RUNNER_TEMP/esp-bsp/bsp/candis_s31" \
            idf.py --preview -C examples/esp-idf/low-power \
              -D IDF_TARGET=esp32s31 build

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-${{ env.IDF_COMMIT }}-esp32s31-v1

      - name: Install ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$IDF_REF" --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"
          ~/esp-idf/install.sh esp32s31

      - name: Verify cached ESP-IDF
        if: steps.idf-cache.outputs.cache-hit == 'true'
        run: test "$(git -C ~/esp-idf rev-parse HEAD)" = "$IDF_COMMIT"

      - name: Fetch ESP-BSP (Candis-S31 BSP)
        run: |
          git clone https://github.com/LeenixP/esp-bsp.git "$RUNNER_TEMP/esp-bsp"
          git -C "$RUNNER_TEMP/esp-bsp" checkout "$ESP_BSP_COMMIT"


      - name: Validate Factory host and Recovery tooling
        run: |
          python3 firmware/factory/host_tools/run_evt.py --self-test
          bash -n firmware/recovery/flash_factory.sh
          bash -n tools/release/pack_factory_release.sh
      - name: Build factory firmware
        run: |
          . ~/esp-idf/export.sh
          CANDIS_S31_BSP_PATH="$RUNNER_TEMP/esp-bsp/bsp/candis_s31" \
            idf.py --preview -C firmware/factory -D IDF_TARGET=esp32s31 build
          idf.py --preview -C firmware/factory merge-bin \
            --output candis_s31_factory_merged.bin --format raw

      # Packaging dry-run only: this assembles the release staging directory
      # and archive as CI artifacts. Publishing a GitHub Release stays a
      # manual step performed after hardware validation.
      - name: Pack factory release (dry-run)
        run: |
          RELEASE_NAME="ci-${GITHUB_SHA}" \
          CANDIS_S31_BSP_PATH="$RUNNER_TEMP/esp-bsp/bsp/candis_s31" \
          IDF_PATH=~/esp-idf \
            tools/release/pack_factory_release.sh firmware/factory "$RUNNER_TEMP/factory-release"
          python3 -c 'from pathlib import Path; p=Path("'"$RUNNER_TEMP"'/factory-release/launchpad.toml"); s=p.read_text(); assert "ci-${{ github.sha }}" in s and "@" not in s and "<tag>" not in s'

      - name: Upload factory release dry-run
        uses: actions/upload-artifact@v4
        with:
          name: candis-s31-factory-release-dryrun
          path: ${{ runner.temp }}/factory-release.*
          if-no-files-found: error
